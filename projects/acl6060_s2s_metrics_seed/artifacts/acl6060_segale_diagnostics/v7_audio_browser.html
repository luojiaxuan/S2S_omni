  for(const t of Object.keys(DATA[curRun].talks)){
    const b=document.createElement('button');b.textContent=labels[t]||('talk '+t);
    b.className=t===curTalk?'on':'';b.onclick=()=>{curTalk=t;render();};talks.appendChild(b);
  }
  $('explain').innerHTML=DATA[curRun].explain||'';
  $('tbl').className=DATA[curRun].noasr?'noasr':'';
  const p=$('player');
  p.src=AUDIO_BASE+'/'+curRun+'_talk'+curTalk+'.mp3';
  const tb=$('tbody');tb.innerHTML='';
  DATA[curRun].talks[curTalk].forEach((u,i)=>{
    const tr=document.createElement('tr');
    if(u.r!==null&&u.r<0.35)tr.className='low';
    else if(u.r!==null&&u.r<0.6)tr.className='mid';
    let badge='';
    if(u.flag==='swallow')badge='<span class="badge swallow">🔇吞轮</span>';
    if(u.flag==='overlong')badge='<span class="badge overlong">📢超长</span>';
    tr.innerHTML='<td>'+i+'</td>'
      +'<td class="t0" data-t="'+u.t0+'">'+fmt(u.t0)+'</td>'
      +'<td>'+u.dur.toFixed(2)+'s</td>'
      +'<td>'+esc(u.text)+badge+'</td>'
      +'<td>'+esc(u.asr)+'</td>'
      +'<td class="r">'+(u.r===null?'–':u.r.toFixed(2))+'</td>';
    tr.querySelector('.t0').onclick=e=>{p.currentTime=parseFloat(e.target.dataset.t);p.play();};
    tb.appendChild(tr);
  });
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
render();
</script>
</body>
</html>
